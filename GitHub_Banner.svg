<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="300" viewBox="0 0 1500 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06152f">
        <animate attributeName="stop-color" values="#06152f;#0b1f52;#06152f" dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#123f9c">
        <animate attributeName="stop-color" values="#123f9c;#0a2d73;#123f9c" dur="18s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1500" height="300" fill="url(#bg)"/>

  <!-- drifting particles -->
  <g fill="#7fdcff" opacity="0.55">
    <circle r="2" cx="120" cy="60">
      <animate attributeName="cx" values="120;1380" dur="30s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;80;50;60" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" cx="800" cy="220">
      <animate attributeName="cx" values="800;100" dur="34s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;180;230;220" dur="34s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" cx="1320" cy="110">
      <animate attributeName="cx" values="1320;300" dur="26s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- subtle geometric lines -->
  <g stroke="#5db9ff" stroke-opacity="0.18" fill="none">
    <path d="M980 250 L1100 170 L1220 170 L1320 90 L1480 90"/>
    <path d="M940 280 L1080 210 L1210 210 L1360 130 L1490 130"/>
    <polygon points="1260,55 1285,40 1310,55 1310,85 1285,100 1260,85"/>
  </g>

  <!-- faint scrolling code -->
  <g opacity="0.08" font-family="monospace" font-size="22" fill="#ffffff">
    <text x="760" y="105">
      const developer = &#123; stack: "MERN" &#125;;
      <animate attributeName="x" values="760;620;760" dur="24s" repeatCount="indefinite"/>
    </text>
    <text x="820" y="145">
      function build() &#123; return learn(); &#125;
      <animate attributeName="x" values="820;680;820" dur="26s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- title -->
  <text x="120" y="165"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="700"
        fill="#f8f9fb"
        filter="url(#glow)">
    Muthukumar K
  </text>

  <!-- blinking cursor -->
  <rect x="635" y="122" width="4" height="54" fill="#dff8ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
